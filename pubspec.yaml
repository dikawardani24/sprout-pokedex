name: sprout_pokedex
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  api:
    path: ./app_core/api
  database:
    path: ./app_core/database
  core:
    path: ./app_core/core
  core_ui:
    path: ./app_core/core_ui
  feature_home:
    path: ./features/feature_home
  feature_detail:
    path: ./features/feature_detail
  feature_chat:
    path: ./features/feature_chat
  cupertino_icons: ^1.0.8
  pokedex: ^0.3.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  flutter_bloc: ^9.1.1
  flutter_animate: ^4.5.2
  get_it: ^9.0.5
  injectable: ^2.6.0
  equatable: ^2.0.7
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.1
  collection: ^1.19.1
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  freezed_annotation: ^2.4.4
  sqflite: ^2.4.2
  path: ^1.9.1
  json_annotation: ^4.9.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  sqflite_common_ffi: ^2.4.0
  http_interceptor: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  injectable_generator: ^2.4.1
  mockito: ^5.4.4
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  flutter_lints: ^4.0.0
  freezed: ^2.5.8
  melos: ^3.4.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/imgs/pokeball.png
    - assets/imgs/mask_pokeball.png
    - assets/imgs/pokeball_colored.png
    - assets/imgs/pokeball_colored_small.webp
    - assets/imgs/snorlax.svg
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
        - asset: assets/fonts/poppins_italic.ttf
        - asset: assets/fonts/poppins_bold.ttf